services:
  postgres:
    image: postgres:17
    container_name: gymple-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymple}
      POSTGRES_USER: ${POSTGRES_USER:-gymple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymple}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Development mail catcher: SMTP on 1025, web inbox on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: gymple-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
