services:
  mysql:
    image: mysql:8.4
    container_name: gymple-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gymple}
      MYSQL_USER: ${MYSQL_USER:-gymple}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gymple}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Development mail catcher: SMTP on 1025, web inbox on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: gymple-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  mysql-data:
